<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Component</title>
  <link rel="stylesheet" href="task10.css">
</head>
<body>

  <div class="card">
    <header class="header">
      <div class="avatar"></div>
      <div class="info">
        <h3 class="name">Arnold Schwarzenegger</h3>
        <a href="#" class="link">Editar</a>
      </div>
      <div class="arrow">▼</div>
    </header>

    <main class="main">
      <p class="text">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed rhoncus nibh sapien, quis semper nunc mollis quis. Ut blandit, massa vel iaculis bibendum, elit tortor suscipit ante, in venenatis nisl dolor ac massa.
      </p>
      <div class="image"></div>
    </main>
    <hr>
    <footer class="footer">
      <div class="actions">
        <a href="#">Like</a>
        <a href="#">Tweet</a>
        <a href="#">Comment</a>
      </div>
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </footer>
  </div>

</body>
</html>
